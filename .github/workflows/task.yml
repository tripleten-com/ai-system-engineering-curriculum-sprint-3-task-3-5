# Coldline - Task 3.5
# File: .github/workflows/task.yml
# Component: Published Task CI
# Purpose: Run the student-visible verification contract on pull requests.
# Interacts With: uv, Poe, Docker Compose
# Sprint/Task: Sprint 3 - Project 3 / Task 3.5
# Concepts: Deterministic assessment, CI reliability gate
# Tools: GitHub Actions
#
# Known-wrong variant "unrelated-check": the reliability-gate job's placeholder step is
# replaced with `poe unit`, a real, deterministic, currently-passing command — a
# plausible mistake since it genuinely stops the placeholder from being a no-op. But
# `poe unit` runs no Docker Compose stack and reads neither the deployed queue's redrive
# policy nor the deployed alert rule's window, so it stays green whether or not either
# setting regresses to its own Task's known starting-broken value. This is the exact
# defect tests/contract/test_reliability_gate.py's static and live checks both catch.

name: Task 3.5 verification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: >-
      !startsWith(github.head_ref, 'export/')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: "3.12"
      - name: Install pinned tooling
        run: |
          python infra/scripts/bootstrap.py
          python infra/scripts/preflight.py
          echo "$PWD/.tools/bin" >> "$GITHUB_PATH"
          .tools/bin/uv sync --frozen
      - name: Start the pinned runtime
        run: .tools/bin/uv run --frozen poe start
      - name: Ingest the supplied corpus
        run: .tools/bin/uv run --frozen poe ingest
      - name: Verify the public contract
        run: .tools/bin/uv run --frozen poe verify
      - name: Stop the runtime
        if: always()
        run: .tools/bin/uv run --frozen poe reset

  reliability-gate:
    if: >-
      !startsWith(github.head_ref, 'export/')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: "3.12"
      - name: Install pinned tooling
        run: |
          python infra/scripts/bootstrap.py
          python infra/scripts/preflight.py
          echo "$PWD/.tools/bin" >> "$GITHUB_PATH"
          .tools/bin/uv sync --frozen
      - name: Start the pinned runtime
        run: .tools/bin/uv run --frozen poe start
      - name: Run the reliability check
        run: .tools/bin/uv run --frozen poe unit
      - name: Stop the runtime
        if: always()
        run: .tools/bin/uv run --frozen poe reset
